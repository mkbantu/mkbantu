name: Latest dev.to articles

on:
  # Pull new posts once a day
  schedule:
    - cron: "0 6 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  update-readme-with-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README with the latest posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://dev.to/feed/mkbantu"
          max_post_count: 5
          comment_tag_name: "BLOG-POST-LIST"
          commit_message: "docs: update latest articles"
